[package]
name = "vue3d_core"
version = "0.1.0"
edition = "2021"
authors = ["Victory Ukpong"]
description = "VUE 3D Canvas - painting core and Windows desktop window"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vue_3d_canvas"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"

[features]
default = []
wasm = ["dep:wasm-bindgen"]


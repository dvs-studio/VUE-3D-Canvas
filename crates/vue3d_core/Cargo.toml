[package]
name = "vue3d_core"
version = "0.1.0"
edition = "2021"
authors = ["Victory Ukpong"]
description = "VUE 3D Canvas - Core Graphics Engine, Blender 2.8+ Node Bridge & WASM Module"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

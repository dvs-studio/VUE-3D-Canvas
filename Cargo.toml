[package]
name = "vue_3d_canvas"
version = "0.1.0"
authors = ["Victory Ukpong <victory@dvs-studio>"]
edition = "2021"
description = "VUE 3D Canvas - 3D texture painting and sculpting workstation. Builds for native and WebAssembly (wasm)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/dvs-studio/VUE-3D-Canvas"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vue_3d_canvas"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console"] }

[features]
default = ["native"]
native = []
wasm = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

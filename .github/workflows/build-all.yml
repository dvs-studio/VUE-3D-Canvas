name: Build VUE 3D Canvas - Complete Suite (ZIP Artifacts)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vue-3d-canvas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # 1. WINDOWS NATIVE RELEASE (.EXE -> ZIP)
  # --------------------------------------------------
  build-windows:
    name: Build Windows Native Release (ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify Cargo manifest
        shell: pwsh
        run: |
          if (!(Test-Path "Cargo.toml")) {
            throw "Cargo.toml was not found in the repository root."
          }

      - name: Build Windows release executable
        run: cargo build --release --bin vue_3d_canvas

      - name: Prepare Windows output & Compress to ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "windows-pkg" | Out-Null

          $exe = "target/release/vue_3d_canvas.exe"
          if (!(Test-Path $exe)) {
            $exe = "target/x86_64-pc-windows-msvc/release/vue_3d_canvas.exe"
          }
          if (!(Test-Path $exe)) {
            throw "Windows executable was not generated at $exe"
          }

          Copy-Item $exe "windows-pkg/"
          Copy-Item "README.md" "windows-pkg/" -ErrorAction SilentlyContinue
          Copy-Item "WINDOWS_BUILD_INSTRUCTIONS.md" "windows-pkg/" -ErrorAction SilentlyContinue

          # Save output to artifact in zip format
          Compress-Archive -Path "windows-pkg/*" -DestinationPath "vue-3d-canvas-windows-x64.zip" -Force
          Write-Host "Created ZIP artifact: vue-3d-canvas-windows-x64.zip"

      - name: Upload Windows Executable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-3d-canvas-windows-x64-zip
          path: vue-3d-canvas-windows-x64.zip
          if-no-files-found: error

  # --------------------------------------------------
  # 2. WEBASSEMBLY BROWSER CORE (WASM -> ZIP)
  # --------------------------------------------------
  build-wasm:
    name: Build Browser WASM Module (ZIP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM package
        run: |
          set -euo pipefail
          mkdir -p wasm_build_pkg
          wasm-pack build crates/vue3d_core \
            --target web \
            --release \
            --out-dir "$GITHUB_WORKSPACE/wasm_build_pkg"

      - name: Compress WASM package to ZIP
        run: |
          set -euo pipefail
          sudo apt-get install -y zip
          zip -r vue-3d-canvas-wasm.zip wasm_build_pkg/
          ls -lh vue-3d-canvas-wasm.zip

      - name: Upload WASM ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-3d-canvas-wasm-zip
          path: vue-3d-canvas-wasm.zip
          if-no-files-found: error

  # --------------------------------------------------
  # 3. FRONTEND PRODUCTION CLIENT (DIST -> ZIP)
  # --------------------------------------------------
  build-frontend:
    name: Build Frontend Web Client (ZIP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm install
            npm run build
          fi

          if [ ! -d dist ]; then
            echo "::error::Expected frontend output directory 'dist' was not found."
            exit 1
          fi

      - name: Compress Frontend to ZIP
        run: |
          set -euo pipefail
          sudo apt-get install -y zip
          zip -r vue-3d-canvas-frontend.zip dist/
          ls -lh vue-3d-canvas-frontend.zip

      - name: Upload Frontend ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-3d-canvas-frontend-zip
          path: vue-3d-canvas-frontend.zip
          if-no-files-found: error

  # --------------------------------------------------
  # 4. ASSEMBLE SELF-HOSTED MASTER SUITE (ZIP)
  # --------------------------------------------------
  assemble-self-hosted:
    name: Assemble Self-Hosted Master Suite (ZIP)
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-wasm
      - build-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-3d-canvas-windows-x64-zip
          path: download-windows/

      - name: Download WASM ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-3d-canvas-wasm-zip
          path: download-wasm/

      - name: Download Frontend ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-3d-canvas-frontend-zip
          path: download-frontend/

      - name: Extract Artifacts & Populate Self-Host Package
        run: |
          set -euo pipefail
          sudo apt-get install -y unzip zip

          mkdir -p self-host/windows self-host/wasm_pkg self-host/public self-host/storage/projects self-host/storage/textures

          # Extract Windows binary
          if [ -f download-windows/vue-3d-canvas-windows-x64.zip ]; then
            unzip -o download-windows/vue-3d-canvas-windows-x64.zip -d self-host/windows/ || true
          fi

          # Extract WASM package
          if [ -f download-wasm/vue-3d-canvas-wasm.zip ]; then
            unzip -o download-wasm/vue-3d-canvas-wasm.zip -d self-host/wasm_pkg/ || true
          fi

          # Extract Frontend distribution
          if [ -f download-frontend/vue-3d-canvas-frontend.zip ]; then
            unzip -o download-frontend/vue-3d-canvas-frontend.zip -d extracted-frontend/ || true
            if [ -d extracted-frontend/dist ]; then
              cp -r extracted-frontend/dist/* self-host/public/
            elif [ -d extracted-frontend ]; then
              cp -r extracted-frontend/* self-host/public/
            fi
          fi

          # Create build information manifest
          cat > self-host/BUILD-INFO.txt <<EOF
          ========================================================================
          Project: VUE 3D Canvas - Self-Hosted Full Programme
          Author / Creator: Victory Ukpong
          Source Branch: $GITHUB_REF_NAME
          Source Commit: $GITHUB_SHA
          Build Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          ========================================================================

          Contents:
          - server.js           : Standalone zero-dependency self-hosted Node HTTP server
          - public/             : Pre-built production web client & WebGL canvas
          - storage/projects/   : Persistent .xblend project storage
          - storage/textures/   : Custom decals & texture storage
          - windows/            : Compiled native Windows executable (vue_3d_canvas.exe)
          - wasm_pkg/           : Compiled WebAssembly engine
          - start.bat           : Windows 1-click startup script
          - start.sh            : Linux / macOS startup script
          - Dockerfile          : Docker container definition
          - docker-compose.yml  : Docker Compose configuration
          ========================================================================
          EOF

      - name: Compress Full Self-Hosted Distribution into Master ZIP
        run: |
          set -euo pipefail
          zip -r vue-3d-canvas-full-suite.zip self-host/
          ls -lh vue-3d-canvas-full-suite.zip

      - name: Upload Full Programme Master ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-3d-canvas-full-suite-zip
          path: vue-3d-canvas-full-suite.zip
          if-no-files-found: error

      - name: Publish Self-Host Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin ci/self-host-built || true
          git checkout -B ci/self-host-built origin/ci/self-host-built || git checkout -B ci/self-host-built

          git add self-host/
          if git diff --staged --quiet; then
            echo "No changes to commit to ci/self-host-built."
          else
            git commit -m "CI: publish complete self-hosted suite [skip ci]"
            git push origin ci/self-host-built --force-with-lease || echo "Branch push skipped or succeeded"
          fi

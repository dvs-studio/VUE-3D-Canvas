name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Inspect Rust Project
        shell: pwsh
        run: |
          Write-Host "===== Cargo.toml ====="
          Get-Content Cargo.toml

          Write-Host "===== Rust source files ====="
          Get-ChildItem src -Recurse -File |
            Select-Object -ExpandProperty FullName

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cargo build --release

          if ($LASTEXITCODE -ne 0) {
            throw "Cargo build failed."
          }

      - name: Inspect Build Output
        shell: pwsh
        run: |
          Write-Host "===== Target directory ====="

          if (Test-Path target) {
            Get-ChildItem target -Recurse -File |
              Select-Object FullName, Length
          } else {
            Write-Host "No target directory was created."
          }

          Write-Host "===== Cargo binary targets ====="
          cargo metadata --no-deps --format-version 1 |
            Out-File -FilePath cargo-metadata.json -Encoding utf8

          $metadata = Get-Content cargo-metadata.json -Raw |
            ConvertFrom-Json

          foreach ($package in $metadata.packages) {
            Write-Host "Package: $($package.name)"

            foreach ($target in $package.targets) {
              Write-Host "Target: $($target.name)"
              Write-Host "Types: $($target.kind -join ', ')"
            }
          }

      - name: Prepare Executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $executables = @(
            Get-ChildItem target -Filter "*.exe" -File -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '[\\/]release[\\/]'
              }
          )

          if ($executables.Count -eq 0) {
            Write-Host "No release executables were generated."
            Write-Host "The diagnostic output above should explain what Cargo built."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path builds |
            Out-Null

          foreach ($exe in $executables) {
            Copy-Item $exe.FullName builds/ -Force
            Write-Host "Prepared $($exe.Name)"
          }

      - name: Commit and Push Executables
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update compiled Windows executables"
          file_pattern: "builds/*.exe"

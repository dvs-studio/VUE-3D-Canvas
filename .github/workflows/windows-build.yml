name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package complete release output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "target/release")) {
            throw "The target/release directory was not created."
          }

          if (!(Get-ChildItem "target/release" -Force | Select-Object -First 1)) {
            throw "The target/release directory is empty."
          }

          Compress-Archive `
            -Path "target/release/*" `
            -DestinationPath "VUE-3D-Canvas-Windows.zip" `
            -CompressionLevel Optimal `
            -Force

          Write-Host "Created VUE-3D-Canvas-Windows.zip"
          Get-Item "VUE-3D-Canvas-Windows.zip" |
            Select-Object Name, Length

      - name: Upload complete Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VUE-3D-Canvas-Windows
          path: VUE-3D-Canvas-Windows.zip
          if-no-files-found: error
          retention-days: 30

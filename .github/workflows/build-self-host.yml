name: Build Self-Hosted Programme

on:
  workflow_dispatch:
  push:
    branches: [main, ai/uv-seam-live-sync-background-layers-2026-11-23]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/sync_self_host.mjs'
      - 'self-host/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-self-host.yml'

permissions:
  contents: write

# Rapid source edits otherwise launch concurrent self-host syncs that race
# when each run commits the generated public bundle to this same branch.
concurrency:
  group: self-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-self-host:
    name: Pack the painter for file and http
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript diagnostics
        run: npm run lint

      - name: Build and sync self-host
        run: npm run host:sync

      - name: Refuse an incomplete or blank self-host build
        run: |
          set -euo pipefail
          test -s self-host/public/index.html
          test -f self-host/server.js
          grep -q "VUE 3D Canvas" self-host/public/index.html
          grep -q 'id="root"' self-host/public/index.html
          grep -q 'type="module"' self-host/public/index.html
          if grep -q 'src="[^"]*\.js"' self-host/public/index.html; then
            echo "index.html still loads an external script, so file:// may be blank."
            exit 1
          fi

      - name: Commit the validated self-host output and remove stale bundles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A self-host/public
          if ! git diff --cached --quiet; then
            git commit -m "chore(self-host): sync generated painter output [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "self-host/public already matches the current build."
          fi

      - name: Zip the self-host folder
        run: |
          set -euo pipefail
          mkdir -p packaging
          tar -C self-host --exclude storage -czf packaging/VUE_3D_Canvas_SelfHost.tar.gz .
          tar -tzf packaging/VUE_3D_Canvas_SelfHost.tar.gz | sed -n '1,10p'

      - name: Upload the self-host package
        uses: actions/upload-artifact@v4
        with:
          name: VUE_3D_Canvas_SelfHost
          path: packaging/VUE_3D_Canvas_SelfHost.tar.gz
          if-no-files-found: error

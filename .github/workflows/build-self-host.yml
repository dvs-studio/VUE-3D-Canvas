name: Build Self-Hosted Full Programme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-self-host:
    name: Build Self-Hosted Suite & Package ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable) & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WebAssembly Module
        run: |
          set -euo pipefail
          mkdir -p self-host/wasm_pkg
          wasm-pack build crates/vue3d_core \
            --target web \
            --release \
            --out-dir "$GITHUB_WORKSPACE/self-host/wasm_pkg"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Build
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm install
            npm run build
          fi

      - name: Assemble Self-Hosted Distribution
        run: |
          set -euo pipefail
          mkdir -p self-host/public
          if [ -d dist ]; then
            cp -r dist/* self-host/public/
          fi
          mkdir -p self-host/storage/projects self-host/storage/textures

      - name: Package Self-Hosted Distribution to ZIP Format
        run: |
          set -euo pipefail
          sudo apt-get install -y zip
          zip -r vue-3d-canvas-self-hosted.zip self-host/
          ls -lh vue-3d-canvas-self-hosted.zip

      - name: Upload Self-Hosted ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-3d-canvas-self-hosted-zip
          path: vue-3d-canvas-self-hosted.zip
          if-no-files-found: error

      - name: Commit and Push Self-Host Output to Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "${GIT_COMMITTER_NAME}"
          git config user.email "${GIT_COMMITTER_EMAIL}"

          git fetch origin ci/self-host-built || true
          git checkout -B ci/self-host-built origin/ci/self-host-built || git checkout -B ci/self-host-built

          git add self-host
          if git diff --staged --quiet; then
            echo "No changes to commit to ci/self-host-built branch."
          else
            git commit -m "CI: update self-hosted distribution [skip ci]"
            git push origin ci/self-host-built --force-with-lease || echo "Branch push skipped or succeeded"
          fi
